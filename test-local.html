<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD Boolean - Local Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="appContainer">
        <header>
            <div class="header-flex-inline">
                <div class="header-main-inline">
                    <h1 class="bullion-title">
                        <span class="gold-text">GOLD</span> <span class="bullion-text"><i>Boolean</i></span>
                    </h1>
                    <nav>
                        <button class="nav-btn active" data-section="storage">Storage</button>
                        <button class="nav-btn bullion-btn" data-section="builder">Builder</button>
                        <button class="nav-btn" data-section="trainer">Trainer</button>
                    </nav>
                </div>
                <div class="data-management-inline-group">
                    <div class="data-actions-row-inline">
                        <button onclick="exportData()" class="backup-btn" title="Download a backup of all your data to your computer.">💾</button>
                        <button onclick="importData()" class="backup-btn" title="Import a backup file to restore your data.">📁</button>
                        <button onclick="clearAllData()" class="backup-btn danger" title="Clear all data from the app. This cannot be undone!">🗑️</button>
                        <span id="dataStatus" class="data-status" title="Shows the current save status. Always 'Saved' if your data is up to date.">✓</span>
                    </div>
                    <div class="user-info-section">
                        <div id="userInfo" class="user-info">
                            <span id="userEmail" class="user-email">Local User</span>
                            <span class="user-status">✓ Data Saved Locally</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section id="storage" class="section active">
                <h2>Storage</h2>
                <div class="storage-container">
                    <div class="categories-panel">
                        <h3>Directory</h3>
                        <div id="categoryList" class="category-list">
                            <!-- Categories will be populated here -->
                        </div>
                    </div>
                    <div class="keywords-panel">
                        <div id="categoryView">
                            <h3 id="currentCategoryTitle">Select a Category</h3>
                            <div id="categoryContent">
                                <p style="color: #7f8c8d; font-style: italic;">Click on a category to view and manage its items.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Test that the app loads without Firebase
        console.log('Testing local app initialization...');
        
        // Check if key functions exist
        if (typeof loadData === 'function') {
            console.log('✅ loadData function exists');
        } else {
            console.error('❌ loadData function missing');
        }
        
        if (typeof setupNavigation === 'function') {
            console.log('✅ setupNavigation function exists');
        } else {
            console.error('❌ setupNavigation function missing');
        }
        
        if (typeof renderAll === 'function') {
            console.log('✅ renderAll function exists');
        } else {
            console.error('❌ renderAll function missing');
        }
        
        console.log('Local app test complete!');
    </script>
</body>
</html>
